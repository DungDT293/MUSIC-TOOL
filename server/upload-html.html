<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload File to R2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .upload-area {
            border: 2px dashed #ccc;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            margin: 20px 0;
        }
        .upload-area.dragover {
            border-color: #007bff;
            background-color: #f0f8ff;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        .progress {
            margin: 20px 0;
            display: none;
        }
        .progress.active {
            display: block;
        }
        .progress-bar {
            width: 100%;
            height: 20px;
            background-color: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background-color: #007bff;
            width: 0%;
            transition: width 0.3s;
        }
        .result {
            margin: 20px 0;
            padding: 10px;
            border-radius: 4px;
            display: none;
        }
        .result.success {
            background-color: #d4edda;
            color: #155724;
            display: block;
        }
        .result.error {
            background-color: #f8d7da;
            color: #721c24;
            display: block;
        }
    </style>
</head>
<body>
    <h1>📤 Upload File to R2</h1>
    
    <div class="upload-area" id="uploadArea">
        <p>📁 Kéo thả file vào đây hoặc click để chọn</p>
        <input type="file" id="fileInput" style="display: none;">
        <button onclick="document.getElementById('fileInput').click()">Chọn File</button>
    </div>

    <div class="progress" id="progress">
        <p>Đang upload: <span id="progressText">0%</span></p>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>

    <div class="result" id="result"></div>

    <script>
        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progress = document.getElementById('progress');
        const progressText = document.getElementById('progressText');
        const progressFill = document.getElementById('progressFill');
        const result = document.getElementById('result');

        // Worker URL - Thay đổi theo Worker của bạn
        const WORKER_URL = 'https://r2-upload.dungdong333.workers.dev';

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file) {
                uploadFile(file);
            }
        });

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                uploadFile(file);
            }
        });

        async function uploadFile(file) {
            result.className = 'result';
            progress.classList.add('active');
            progressText.textContent = '0%';
            progressFill.style.width = '0%';

            const formData = new FormData();
            formData.append('file', file);
            formData.append('key', `win/${file.name}`);

            try {
                const xhr = new XMLHttpRequest();

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        progressText.textContent = percent + '%';
                        progressFill.style.width = percent + '%';
                    }
                });

                xhr.addEventListener('load', () => {
                    progress.classList.remove('active');
                    if (xhr.status === 200) {
                        const response = JSON.parse(xhr.responseText);
                        result.className = 'result success';
                        result.innerHTML = `
                            <h3>✅ Upload thành công!</h3>
                            <p>File: ${file.name}</p>
                            <p>Size: ${(file.size / 1024 / 1024).toFixed(2)} MB</p>
                            <p>Key: ${response.key}</p>
                            <p><strong>URL:</strong> <a href="https://license-updates-proxy.dungdong333.workers.dev/${response.key}" target="_blank">https://license-updates-proxy.dungdong333.workers.dev/${response.key}</a></p>
                        `;
                    } else {
                        throw new Error(xhr.responseText);
                    }
                });

                xhr.addEventListener('error', () => {
                    progress.classList.remove('active');
                    result.className = 'result error';
                    result.innerHTML = '<h3>❌ Upload thất bại!</h3><p>Vui lòng thử lại.</p>';
                });

                xhr.open('POST', WORKER_URL);
                xhr.send(formData);
            } catch (error) {
                progress.classList.remove('active');
                result.className = 'result error';
                result.innerHTML = `<h3>❌ Lỗi!</h3><p>${error.message}</p>`;
            }
        }
    </script>
</body>
</html>
