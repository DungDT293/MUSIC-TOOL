# Wrangler configuration for R2 Proxy Worker
# Deploy this worker to proxy files from R2 bucket

name = "license-updates-proxy"
main = "r2-proxy-worker.js"
compatibility_date = "2024-01-01"

# R2 Bucket Binding
# Replace 'license-updates-files' with your actual bucket name
[[r2_buckets]]
binding = "UPDATES_BUCKET"
bucket_name = "license-updates-files"

# Optional: Custom domain
# [[routes]]
# pattern = "license-updates.pages.dev/*"
# zone_name = "pages.dev"
